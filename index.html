<!DOCTYPE html>
<html>
<head>
    <title>AI Fake Review Detection</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
            margin-top: 80px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🤖 Fake Review Detection</h2>
    <p>Enter a review to check if it's fake or genuine</p>

    <textarea id="review" placeholder="Type your review here..."></textarea>

    <br>
    <button onclick="checkReview()">Check Review</button>

    <div id="result"></div>
</div>

<footer>
    AI Project | NLP + Machine Learning
</footer>

<script>
async function checkReview() {
    let review = document.getElementById("review").value;
    let result = document.getElementById("result");

    if (review.trim() === "") {
        result.innerText = "⚠️ Please enter a review";
        result.style.color = "orange";
        return;
    }

    result.innerText = "⏳ Checking...";
    result.style.color = "black";

    try {
        let response = await fetch("https://fake-review-api-24y0.onrender.com/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ review: review })
        });

        let data = await response.json();

        if (data.result === "Genuine") {
            result.innerText = "✅ Genuine Review";
            result.style.color = "green";
        } else {
            result.innerText = "❌ Fake Review";
            result.style.color = "red";
        }

    } catch (error) {
        result.innerText = "❌ Server error. Check backend.";
        result.style.color = "red";
    }
}
</script>

</body>
</html>
